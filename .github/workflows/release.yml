name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Release PR or Publish Release
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          # Private package — no npm publish step. Tag + GH Release is enough.
          publish: pnpm exec changeset tag
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack on release
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "channel": "releases",
              "text": ":rocket: *Frontend UI Service released* — v${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}\n<${{ github.server_url }}/${{ github.repository }}/releases/latest|View release notes →>",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    {
                      "title": "Version",
                      "value": "v${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }}",
                      "short": true
                    },
                    {
                      "title": "Repo",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>",
                      "short": false
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
